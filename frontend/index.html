<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prismo: free phone-style photo gallery for Windows &amp; Linux</title>
<meta name="description" content="Prismo puts every photo and video on your PC into one timeline, like your phone's gallery. Free and open source, offline, no account. For Windows and Linux.">
<link rel="canonical" href="https://prismo.mihirr.in/">
<!-- Link previews (WhatsApp, Discord, LinkedIn, X): the picture is public/og.jpg, 1200 × 630 (made from the page: hero text, logo, three demo photos). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Prismo">
<meta property="og:url" content="https://prismo.mihirr.in/">
<meta property="og:title" content="Prismo: free phone-style photo gallery for Windows &amp; Linux">
<meta property="og:description" content="Every photo and video on your PC in one timeline, like your phone's gallery. Free, open source, offline, no account.">
<meta property="og:image" content="https://prismo.mihirr.in/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Prismo: your whole PC, like a phone gallery">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Prismo: free phone-style photo gallery for Windows &amp; Linux">
<meta name="twitter:description" content="Every photo and video on your PC in one timeline, like your phone's gallery. Free, open source, offline, no account.">
<meta name="twitter:image" content="https://prismo.mihirr.in/og.jpg">
<!--app-details-->
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090a14">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef0f6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Instrument+Sans:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Set the theme before first paint so there is no flash: saved choice, else the system's.
  (function () {
    var t = null;
    try { t = localStorage.getItem('prismo-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<!-- Without JavaScript the page is the build-time copy: show its text instead of waiting for the fade-in. -->
<noscript><style>.rise { opacity: 1 !important; translate: none !important; filter: none !important; }</style></noscript>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
