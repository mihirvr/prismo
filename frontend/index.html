<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prismo: a phone-style photo gallery for Windows</title>
<meta name="description" content="Prismo is a free, open-source photo and video gallery for Windows that works like the one on your phone: every photo on your drives in one timeline. Offline, no account, never copies or changes a file.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="/brand/prismo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=Instrument+Sans:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  // Set the theme before first paint so there is no flash: saved choice, else the system's.
  (function () {
    var t = null;
    try { t = localStorage.getItem('prismo-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
