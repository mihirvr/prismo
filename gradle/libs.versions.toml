# Every dependency version lives here (see DEVELOPMENT.md, "The Dependency Rule").

[versions]
java = "25"
javafx = "25.0.4"
slf4j = "2.0.20"
logback = "1.6.5"
sqlite-jdbc = "3.53.4.0"
metadata-extractor = "2.21.0"
twelvemonkeys = "3.15.3"
javacv = "1.5.14"
# FFmpeg version, then the JavaCPP version it was built for.
ffmpeg = "8.1.2-1.5.14"
junit = "6.1.3"
# Not "javafx-plugin": that would turn libs.versions.javafx into a group instead of a version.
openjfx-gradle-plugin = "0.1.0"

[libraries]
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
metadata-extractor = { module = "com.drewnoakes:metadata-extractor", version.ref = "metadata-extractor" }
# ImageIO plugins: register themselves when on the classpath. jpeg = CMYK/odd JPEGs the JDK reader rejects.
twelvemonkeys-jpeg = { module = "com.twelvemonkeys.imageio:imageio-jpeg", version.ref = "twelvemonkeys" }
twelvemonkeys-webp = { module = "com.twelvemonkeys.imageio:imageio-webp", version.ref = "twelvemonkeys" }
# Video (#6 later changes): JavaCV's FFmpegFrameGrabber, the JavaCPP loader, and FFmpeg itself
# (LGPL v3 build; the native files come in a per-OS jar, see build.gradle.kts).
javacv = { module = "org.bytedeco:javacv", version.ref = "javacv" }
javacpp = { module = "org.bytedeco:javacpp", version.ref = "javacv" }
ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "ffmpeg" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version.ref = "openjfx-gradle-plugin" }
